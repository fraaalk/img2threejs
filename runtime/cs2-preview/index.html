<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>★ Sport Gloves | Hedge Maze (Field-Tested) · 3D inspection</title>
  </head>
  <body>
    <main>
      <section class="toolbar">
        <div>
          <p class="eyebrow">CS2 IMAGE-MATCHED RECONSTRUCTION</p>
          <h1>Hedge Maze</h1>
          <p id="status" aria-live="polite">Loading manifest...</p>
        </div>
        <div class="actions">
          <button id="fixed-view" type="button" aria-pressed="true">Fixed view</button>
          <button id="orbit-a" type="button" aria-pressed="false">Orbit A</button>
          <button id="orbit-b" type="button" aria-pressed="false">Orbit B</button>
          <a id="download-artifact" aria-disabled="true">Review artifact</a>
        </div>
      </section>
      <canvas id="preview" aria-label="3D Sport Gloves Hedge Maze Field-Tested preview"></canvas>
      <section class="evidence">
        <span id="state">state: loading</span>
        <span id="tier">tier: unknown</span>
        <span id="coverage">projection coverage: 1.00</span>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
